name: Verify local league export import
on:
  push:
    branches:
      - feature/official-export-offline-import
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: false
      - name: Resolve new dependencies and analyze Dart
        run: |
          flutter pub get
          flutter analyze --no-pub lib test integration_test
          flutter test --no-pub test
      - name: Verify lockfile update is required only for added packages
        run: |
          grep -A4 -E '^  (excel|file_picker):' pubspec.lock
      - uses: actions/upload-artifact@v4
        with:
          name: Offline-import-resolved-pubspec-lock
          path: pubspec.lock
          retention-days: 7
  ios:
    needs: test
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: false
      - name: Build physical iOS ARM64 unsigned
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          flutter config --no-analytics
          flutter pub get
          flutter build ios --release --no-codesign --no-pub --build-name=1.2.0 --build-number=13
      - name: Verify IPA, bundled assets and release metadata
        run: |
          set -euo pipefail
          plutil -lint build/ios/iphoneos/Runner.app/Info.plist
          xcrun lipo build/ios/iphoneos/Runner.app/Runner -verify_arch arm64
          mkdir -p build/feather/Payload
          cp -R build/ios/iphoneos/Runner.app build/feather/Payload/
          (cd build/feather && /usr/bin/ditto -c -k --keepParent Payload PlantHead-Fanta-1.2.0-build13-offline-import-unsigned.ipa)
          python3 tool/verify_ipa.py build/feather/PlantHead-Fanta-1.2.0-build13-offline-import-unsigned.ipa > build/feather/VERIFICATION.json
          shasum -a 256 build/feather/*.ipa > build/feather/SHA256.txt
          git rev-parse HEAD > build/feather/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PlantHead-Fanta-1.2.0-build13-unsigned-offline-import
          retention-days: 7
          path: |
            build/feather/*.ipa
            build/feather/SHA256.txt
            build/feather/VERIFICATION.json
            build/feather/SOURCE_COMMIT.txt
