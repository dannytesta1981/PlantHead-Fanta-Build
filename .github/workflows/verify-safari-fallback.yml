name: Safari fallback candidate iOS (independent branch)
on:
  push:
    branches:
      - fix/safari-official-access-fallback
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify visible native Safari fallback exists
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/ui/fanta_home.dart').read_text()
          assert "tooltip: 'Apri Leghe Fantacalcio in Safari'" in p
          assert "_openExternal(NavigationPolicy.home)" in p
          assert "child: const Text('Safari')" in p
          assert "LaunchMode.externalApplication" in p
          print("Native Safari fallback verified")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run existing JavaScript tests
        run: |
          cd tool
          npm ci --no-audit --no-fund
          node --test *.test.mjs
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: false
      - name: Analyze and test app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub lib test integration_test
          flutter test --no-pub test
  ios:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: false
      - name: Compile unsigned iOS 1.1.9 build 12
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          flutter build ios --release --no-codesign --no-pub --build-name=1.1.9 --build-number=12
      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail
          plutil -lint build/ios/iphoneos/Runner.app/Info.plist
          xcrun lipo build/ios/iphoneos/Runner.app/Runner -verify_arch arm64
          mkdir -p build/feather/Payload
          cp -R build/ios/iphoneos/Runner.app build/feather/Payload/
          (cd build/feather && /usr/bin/ditto -c -k --keepParent Payload PlantHead-Fanta-1.1.9-build12-unsigned-SAFARI-FALLBACK.ipa)
          python3 tool/verify_ipa.py build/feather/PlantHead-Fanta-1.1.9-build12-unsigned-SAFARI-FALLBACK.ipa > build/feather/VERIFICATION.json
          shasum -a 256 build/feather/*.ipa > build/feather/SHA256.txt
          git rev-parse HEAD > build/feather/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PlantHead-Fanta-1.1.9-build12-Safari-fallback-unsigned
          retention-days: 7
          path: |
            build/feather/*.ipa
            build/feather/SHA256.txt
            build/feather/VERIFICATION.json
            build/feather/SOURCE_COMMIT.txt
