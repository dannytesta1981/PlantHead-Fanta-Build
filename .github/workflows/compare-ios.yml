name: Deterministic WKWebView preflight - no IPA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-home-comparison
  cancel-in-progress: false
jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: false
      - name: Pin simulator and record unmodified sources
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          shasum -a 256 lib/ui/fanta_home.dart lib/core/web_load_monitor.dart assets/official_access.js assets/content_readiness.js > evidence/production-hashes.txt
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version > evidence/environment.txt
          echo 'iPhone 16 / iOS 18.5; erased fresh simulator; local HTTP fixture; no credentials; single official home attempt' >> evidence/environment.txt
          xcrun simctl create PHDeterministic com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-5 > device-id.txt
          DEVICE=$(cat device-id.txt)
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Instrument disposable simulator copy and compile
        run: |
          set -euo pipefail
          python3 comparison/instrument_fixture.py
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub lib integration_test/runtime_fixture_test.dart > evidence/fixture-analysis.txt 2>&1
          flutter build ios --simulator --debug --no-pub --target=integration_test/runtime_fixture_test.dart > evidence/simulator-build.log 2>&1
      - name: Assert deterministic cases and observe official site once
        run: python3 comparison/run_fixture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Deterministic-WKWebView-evidence
          retention-days: 3
          path: evidence/
