name: planthead_fanta
description: Client indipendente per le pagine ufficiali Leghe Fantacalcio.
publish_to: none
version: 1.1.7+10
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: 6.1.5
  url_launcher: 6.3.2
  shared_preferences: 2.5.3
  path_provider: 2.1.5
  share_plus: 11.1.0
  file_picker: 10.3.3
  excel: 4.0.6
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/navigation.js
    - assets/data_bridge.js
    - assets/access_bridge.js
    - assets/access_inspection.js
    - assets/official_access.js
    - assets/content_readiness.js

