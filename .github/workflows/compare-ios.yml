name: Temporary iOS home comparison - no release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-home-comparison
  cancel-in-progress: false
jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ee32b70e3b2afe56cb51751d848057b36c309569
          path: v114
      - uses: actions/checkout@v4
        with:
          ref: 8ec049e50e09c7dc00d4f4a9a89dfd3c831dcc5a
          path: v115
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: false
      - name: Pin Xcode and simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcrun simctl list runtimes available | grep 'iOS 18.5'
          xcodebuild -version > evidence/environment.txt
          echo 'Model=iPhone 16; runtime=iOS 18.5; erase and boot after both builds; unauthenticated; no login click; fixed 20s settling after boot; identical 360s driver deadline' >> evidence/environment.txt
          xcrun simctl create PHComparison com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-5 > device-id.txt
      - name: Build both observation targets before runtime tests
        shell: bash
        run: |
          set +e
          for VERSION in v114 v115; do
            mkdir -p "evidence/$VERSION"
            git -C "$VERSION" rev-parse HEAD > "evidence/$VERSION/commit.txt"
            shasum -a 256 "$VERSION/lib/ui/fanta_home.dart" > "evidence/$VERSION/source-before.txt"
            python3 harness/comparison/instrument.py "$VERSION" > "evidence/$VERSION/instrumentation.txt" || exit 1
            python3 harness/comparison/run_bounded.py 720 "$VERSION-build.log" "evidence/$VERSION/build-status.json" "$VERSION" bash -c 'flutter config --no-analytics && flutter pub get --enforce-lockfile && flutter build ios --simulator --debug --no-pub --target=integration_test/comparison_test.dart'
          done
      - name: Sequential identical home observations
        shell: bash
        run: |
          set +e
          DEVICE=$(cat device-id.txt)
          for VERSION in v114 v115; do
            xcrun simctl shutdown "$DEVICE" 2>/dev/null || true
            xcrun simctl erase "$DEVICE"
            ERASE=$?
            xcrun simctl boot "$DEVICE"
            BOOT=$?
            xcrun simctl bootstatus "$DEVICE" -b
            BOOTSTATUS=$?
            echo "ERASE_EXIT=$ERASE; BOOT_EXIT=$BOOT; BOOTSTATUS_EXIT=$BOOTSTATUS" > "evidence/$VERSION/reset-status.txt"
            if [ "$ERASE" -ne 0 ] || [ "$BOOT" -ne 0 ] || [ "$BOOTSTATUS" -ne 0 ]; then exit 1; fi
            sleep 20
            if [ -d "$VERSION/build/ios/iphonesimulator/Runner.app" ]; then
              python3 harness/comparison/run_bounded.py 360 "$VERSION-driver.log" "evidence/$VERSION/driver-status.json" "$VERSION" flutter drive --verbose --driver=test_driver/comparison_driver.dart --target=integration_test/comparison_test.dart --use-application-binary=build/ios/iphonesimulator/Runner.app --timeout=180 -d "$DEVICE" --no-pub
            fi
            python3 harness/comparison/collect.py "$VERSION-driver.log" > "evidence/$VERSION/breadcrumbs.json"
            if [ -d "$VERSION/comparison-results" ]; then cp "$VERSION"/comparison-results/* "evidence/$VERSION/"; fi
            xcrun simctl io "$DEVICE" screenshot "evidence/$VERSION/final.png" || true
            xcrun simctl spawn "$DEVICE" log show --last 8m --style json --predicate 'process == "Runner" OR process CONTAINS "WebKit"' > "$VERSION-native.json" 2>/dev/null || true
            python3 harness/tool/summarize_webkit_logs.py "$VERSION-native.json" > "evidence/$VERSION/native-summary.json"
          done
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          out={}
          for version in ['v114','v115']:
            p=Path('evidence')/version/'breadcrumbs.json'
            d=json.loads(p.read_text())
            out[version]={'samplesCollected':d['samplesCollected'],'driverLogPresent':d['driverLogPresent'],'observationComplete':d['samplesCollected']==12}
          Path('evidence/comparison.json').write_text(json.dumps(out,indent=2))
          assert all(x['observationComplete'] for x in out.values()), 'Incomplete evidence; not a comparative pass'
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-114-115-comparison-no-release
          retention-days: 3
          path: evidence/
